name: Rust Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  android:
    name: Build Android native library (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true
          local-cache: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library
        run: cargo ndk -t "${{ matrix.abi }}" -o dist build --release

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: mora-rust-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/
          if-no-files-found: error

  android-demo:
    name: Build Android demo APK
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: mora-rust-android-arm64-v8a
          path: android-demo/app/src/main/jniLibs/arm64-v8a

      - name: Download ARMv7 native library
        uses: actions/download-artifact@v4
        with:
          name: mora-rust-android-armeabi-v7a
          path: android-demo/app/src/main/jniLibs/armeabi-v7a

      - name: Download x86_64 native library
        uses: actions/download-artifact@v4
        with:
          name: mora-rust-android-x86_64
          path: android-demo/app/src/main/jniLibs/x86_64

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-demo
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: mora-rust-android-demo-apk
          path: android-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
