[package]
name = "mora_rust_android"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "A small Rust native core starter for Android"
license = "MIT"
[lib]
name = "mora_rust_android"
crate-type = ["cdylib", "rlib"]
[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
